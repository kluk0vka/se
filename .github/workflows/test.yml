name: PyTest

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r ai_text_agent/requirements.txt
          pip install --force-reinstall "langchain==0.1.13" "langchain-community==0.0.38"
      - name: Run tests
        run: |
          cd ai_text_agent
          python -m pytest tests/ --tb=short